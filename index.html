<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Regtest Command Builder</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #142b49;
      --muted: #576b83;
      --line: #d1dce9;
      --paper: #f2f5fa;
      --panel: #ffffff;
      --blue: #005eb8;
      --blue-dark: #002b5c;
      --focus: #a7d5ff;
      --code: #002b5c;
      --code-ink: #ffffff;
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      border-top: 6px solid var(--blue-dark);
    }

    button, input, select, textarea { font: inherit; }

    .shell {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    .masthead {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 26px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--blue);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      font-weight: 750;
      line-height: 1.05;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      box-shadow: 0 1px 3px rgba(0, 43, 92, .045);
    }

    .source-panel { padding: 20px; }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 11px;
    }

    h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 750;
    }

    textarea, .text-input, select, .number-input {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #fff;
      color: var(--ink);
    }

    textarea:focus, .text-input:focus, select:focus, .number-input:focus {
      outline: 3px solid rgba(0, 94, 184, .16);
      border-color: var(--blue);
    }

    #source {
      min-height: 128px;
      padding: 12px 13px;
      resize: vertical;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.6;
    }

    .source-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 10px;
    }

    .error {
      min-height: 18px;
      color: #a63e2d;
      font-size: 12px;
    }

    .text-button {
      padding: 5px 0;
      border: 0;
      background: transparent;
      color: var(--blue-dark);
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .clear-button {
      min-height: 36px;
      padding: 0 12px;
      border: 1px solid var(--blue-dark);
      border-radius: 4px;
      background: var(--blue-dark);
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }

    .clear-button:hover { background: var(--blue); border-color: var(--blue); }

    .controls-panel { margin-top: 16px; overflow: hidden; }

    .controls-heading {
      padding: 18px 20px 15px;
      border-bottom: 1px solid var(--line);
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      padding: 18px 20px 20px;
    }

    .setting {
      display: flex;
      min-width: 0;
      flex-direction: column;
      gap: 8px;
    }

    .setting-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .setting select, .setting input[type="number"] {
      width: 100%;
      height: 40px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: white;
      color: var(--ink);
      font-size: 14px;
    }

    .setting select:focus, .setting input[type="number"]:focus {
      outline: 3px solid rgba(0, 94, 184, .16);
      border-color: var(--blue);
    }

    .toggle-setting { justify-content: flex-start; }

    .toggle-row {
      display: flex;
      min-height: 40px;
      align-items: center;
      gap: 9px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 650;
    }

    .seed-control-row {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 8px;
    }

    .seed-control-row .toggle-row { flex: 1; }
    .seed-control-row .seed-value { flex: 0 0 100px; width: 100px; }

    .farm-setting { grid-column: span 2; }

    .fixed-value {
      color: var(--blue-dark);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .copy-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 38px;
      padding: 0 13px;
      border: 1px solid var(--blue-dark);
      border-radius: 4px;
      background: var(--blue-dark);
      color: white;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .copy-button:hover { background: var(--blue); }
    .copy-button:focus-visible, .text-button:focus-visible {
      outline: 3px solid rgba(0, 94, 184, .24);
      outline-offset: 2px;
    }

    input[type="checkbox"] {
      width: 17px;
      height: 17px;
      accent-color: var(--blue);
      cursor: pointer;
    }

    .output-panel {
      margin-top: 16px;
      overflow: hidden;
      border: 1px solid var(--blue-dark);
      border-radius: 6px;
      background: var(--code);
      color: var(--code-ink);
      box-shadow: 0 8px 28px rgba(0, 43, 92, .08);
    }

    .output-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 15px 18px;
      border-bottom: 1px solid #42658c;
    }

    .output-heading h2 { color: white; }
    .output-heading .section-note { margin-top: 4px; color: #c8dcef; }
    .copy-button { min-width: 96px; }
    .output-heading .copy-button { border-color: #ffffff; background: #ffffff; color: var(--blue-dark); }
    .output-heading .copy-button:hover { background: #deedfb; }

    #output {
      display: block;
      width: 100%;
      min-height: 112px;
      margin: 0;
      padding: 18px;
      border: 0;
      resize: none;
      overflow: hidden;
      background: transparent;
      color: var(--code-ink);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      line-height: 1.75;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    #output:focus {
      outline: 2px solid var(--focus);
      outline-offset: -3px;
    }

    .footer-note {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding: 12px 2px 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 700px) {
      .shell { width: min(100% - 24px, 560px); padding-top: 24px; }
      .masthead { display: block; }
      .source-panel { padding: 15px; }
      .controls-heading { padding: 15px; }
      .settings-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 15px; }
      .section-heading, .source-actions, .output-heading { flex-wrap: wrap; }
      .footer-note { display: block; }
      .footer-note span { display: block; margin-top: 4px; }
    }

    @media (max-width: 420px) {
      .settings-grid { grid-template-columns: minmax(0, 1fr); }
      .farm-setting { grid-column: auto; }
      h1 { font-size: 30px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div>
        <p class="eyebrow">Altera / Regtest</p>
        <h1>Regtest command builder</h1>
      </div>
    </header>

    <section class="panel source-panel" aria-labelledby="source-title">
      <div class="section-heading">
        <h2 id="source-title">Source command</h2>
      </div>
      <textarea id="source" spellcheck="false" aria-label="Source command"></textarea>
      <div class="source-actions">
        <span class="error" id="parse-error" role="status" aria-live="polite"></span>
        <button class="clear-button" id="clear-button" type="button" title="Clear source command">Clear</button>
      </div>
    </section>

    <section class="panel controls-panel" aria-labelledby="controls-title">
      <div class="controls-heading">
        <h2 id="controls-title">Run settings</h2>
      </div>
      <div class="settings-grid">
        <label class="setting" for="verbosity">
          <span class="setting-label">Verbosity</span>
          <select id="verbosity">
            <option>UVM_NONE</option>
            <option>UVM_LOW</option>
            <option selected>UVM_MEDIUM</option>
            <option>UVM_HIGH</option>
            <option>UVM_FULL</option>
            <option>UVM_DEBUG</option>
          </select>
        </label>
        <div class="setting toggle-setting">
          <span class="setting-label">Seed</span>
          <div class="seed-control-row">
            <label class="toggle-row" for="seed-enabled"><input id="seed-enabled" type="checkbox" checked> Include</label>
            <input id="seed-value" class="seed-value" type="number" min="0" step="1" value="27205" aria-label="Seed value">
          </div>
        </div>
        <div class="setting toggle-setting">
          <span class="setting-label">Dump</span>
          <label class="toggle-row"><input id="dump-enabled" type="checkbox" checked> Enable dump <code class="fixed-value" id="dump-value">--dump_on=1</code></label>
        </div>
        <label class="setting" for="repeat">
          <span class="setting-label">Repeat</span>
          <input id="repeat" type="number" min="1" step="1" value="1">
        </label>
        <label class="setting" for="max-error">
          <span class="setting-label">Max error</span>
          <input id="max-error" type="number" min="1" step="1" value="1">
        </label>
        <div class="setting toggle-setting">
          <span class="setting-label">Delete pass</span>
          <label class="toggle-row"><input id="delete-pass-enabled" type="checkbox" checked> Enable delete pass</label>
        </div>
        <div class="setting toggle-setting farm-setting">
          <span class="setting-label">Farm</span>
          <label class="toggle-row"><input id="farm-enabled" type="checkbox"> Enable farm options</label>
        </div>
      </div>
    </section>

    <section class="output-panel" aria-labelledby="output-title">
      <div class="output-heading">
        <div>
          <h2 id="output-title">Executable command</h2>
        </div>
        <button class="copy-button" id="copy-button" type="button" title="Copy command">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <rect x="5" y="2.5" width="8" height="10" rx="1" stroke="currentColor" stroke-width="1.4"/>
            <path d="M3 5.2v7.3c0 .55.45 1 1 1h6.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          <span>Copy</span>
        </button>
      </div>
      <textarea id="output" aria-label="Editable executable command" spellcheck="false" wrap="soft"></textarea>
    </section>

  </main>

  <script>
    const example = '--dut="c2e" --block="1" --comsw="+define+RANDOM_TAIL_POINTER+MC_D2H_CHANNEL_SEL_SEQ_ORG+REMOVE_EXTRA_UVM_INFO" --d2h_data_drop_no_tid="1" --dm_intf="AXIM" --dm_width="128" --multi_ch="1" --no_split="1" --sriov="1" --dynamic_channel="0" --bas="1" --bam="1" --mcdma="0" --aximm="0" --cs="0" --dmss="0" --max_error="1" --delete_pass_test="1" --branch="DMA_23_2" --config="112" --tile="R_TILE_GEN3" --regr="137" --cov="0" --xprop="1" --verbosity="UVM_NONE" --repeat="2" --mainline_regr="1" --axi_branch="1" --reg-cmd="run_sim.pl" --simsw=+MM_ST_CLK_SAME="1" --simsw=+ENABLE_BAS_LITE_MODE="1" --seed="27205" --dump_on="0" --gui_en="0" --test_name="pcie_mcdma_bas_base_test" --icq="0" --mif_path="mif_config_112" --simsw="-l sim.log" --simsw="+UVM_TIMEOUT=80000000000" --simsw="trans_count=1"';
    const options = [];
    const source = document.querySelector('#source');
    const output = document.querySelector('#output');
    const parseError = document.querySelector('#parse-error');
    const verbosityInput = document.querySelector('#verbosity');
    const seedEnabled = document.querySelector('#seed-enabled');
    const seedValue = document.querySelector('#seed-value');
    const dumpEnabled = document.querySelector('#dump-enabled');
    const dumpValue = document.querySelector('#dump-value');
    const repeatInput = document.querySelector('#repeat');
    const maxErrorInput = document.querySelector('#max-error');
    const deletePassEnabled = document.querySelector('#delete-pass-enabled');
    const farmEnabled = document.querySelector('#farm-enabled');
    const farmOptions = [
      ['--use-local-disk', 'off'],
      ['--return-file-mode', 'min'],
      ['--return-file-compress', 'on'],
      ['--priority', '30'],
      ['--max_priority', '50'],
      ['--farm', null]
    ];
    const farmOptionNames = new Set(farmOptions.map(([name]) => name));
    const fixedOptions = {
      '--seed': { value: '27205', element: seedValue },
      '--dump_on': { value: '1' },
      '--verbosity': { value: 'UVM_MEDIUM' },
      '--repeat': { value: '1' },
      '--max_error': { value: '1' },
      '--delete_pass_test': { value: '1' }
    };

    function tokenize(command) {
      const tokens = [];
      let token = '';
      let quote = '';
      let escaped = false;
      let started = false;

      for (const character of command) {
        if (escaped) {
          token += character;
          escaped = false;
          started = true;
        } else if (character === '\\' && quote !== "'") {
          escaped = true;
          started = true;
        } else if (quote) {
          if (character === quote) quote = '';
          else token += character;
          started = true;
        } else if (character === '"' || character === "'") {
          quote = character;
          started = true;
        } else if (/\s/.test(character)) {
          if (started) tokens.push(token);
          token = '';
          started = false;
        } else {
          token += character;
          started = true;
        }
      }

      if (escaped) token += '\\';
      if (quote) throw new Error('Unclosed quote in source command.');
      if (started) tokens.push(token);
      return tokens;
    }

    function parseCommand(command) {
      const tokens = tokenize(command);
      const parsed = [];
      let start = 0;

      if (tokens[0] === 'reg_exe') {
        start = 1;
      } else if (tokens.length > 1 && !tokens[0].startsWith('-') && !tokens[0].startsWith('+') && tokens[1].startsWith('-')) {
        start = 1;
      }

      if (tokens.length - start >= 4 && tokens.slice(-4).join(' ') === '| tee out.txt &') {
        tokens.splice(-4);
      }

      for (let index = start; index < tokens.length; index += 1) {
        const token = tokens[index];
        if (token.startsWith('--')) {
          const equalsAt = token.indexOf('=');
          let name = token;
          let value = '';
          let hasValue = false;
          if (equalsAt !== -1) {
            name = token.slice(0, equalsAt);
            value = token.slice(equalsAt + 1);
            hasValue = true;
          } else if (index + 1 < tokens.length && !tokens[index + 1].startsWith('--')) {
            value = tokens[index + 1];
            hasValue = true;
            index += 1;
          }

          const omitFromOutput = name === '--reg-cmd' || (name === '--simsw' && value === '-l sim.log');
          parsed.push({ name, value, hasValue, enabled: !omitFromOutput });
        } else {
          parsed.push({ name: token, value: '', hasValue: false, enabled: true });
        }
      }
      return parsed;
    }

    function quoteValue(value) {
      return `"${String(value).replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\$/g, '\\$').replace(/`/g, '\\`')}"`;
    }

    function resizeOutput() {
      output.style.height = 'auto';
      output.style.height = `${output.scrollHeight}px`;
    }

    function renderOutput() {
      const args = [];
      const emitted = new Set();
      const values = {
        '--verbosity': verbosityInput.value,
        '--repeat': repeatInput.value || '1',
        '--max_error': maxErrorInput.value || '1',
        '--delete_pass_test': deletePassEnabled.checked ? '1' : '0',
        '--seed': seedValue.value,
        '--dump_on': dumpEnabled.checked ? '1' : '0'
      };
      const enabled = {
        '--seed': seedEnabled.checked,
        '--verbosity': true,
        '--repeat': true,
        '--max_error': true,
        '--delete_pass_test': true,
        '--dump_on': true
      };

      for (const option of options) {
        if (!option.enabled) continue;
        if (farmOptionNames.has(option.name)) continue;
        if (Object.hasOwn(values, option.name)) {
          if (!enabled[option.name] || emitted.has(option.name)) continue;
          args.push(`${option.name}=${quoteValue(values[option.name])}`);
          emitted.add(option.name);
          continue;
        }
        args.push(option.hasValue ? `${option.name}=${quoteValue(option.value)}` : option.name);
      }

      for (const [name, setting] of Object.entries(fixedOptions)) {
        if (emitted.has(name) || enabled[name] === false) continue;
        args.push(`${name}=${quoteValue(values[name] || setting.value)}`);
      }
      if (farmEnabled.checked) {
        for (const [name, value] of farmOptions) {
          args.push(value === null ? name : `${name}=${quoteValue(value)}`);
        }
      }
      output.value = `reg_exe${args.length ? ` ${args.join(' ')}` : ''} | tee out.txt &`;
      resizeOutput();
    }

    function loadSource() {
      try {
        const parsed = parseCommand(source.value);
        options.splice(0, options.length, ...parsed);
        farmEnabled.checked = parsed.some((option) => farmOptionNames.has(option.name));
        for (const [name, setting] of Object.entries(fixedOptions)) {
          const option = options.find((entry) => entry.name === name);
          if (!option) options.push({ name, value: setting.value, hasValue: true, enabled: true });
          if (setting.element) setting.element.value = option?.value || setting.value;
        }
        const maxErrorOption = parsed.find((option) => option.name === '--max_error');
        maxErrorInput.value = maxErrorOption?.value || '1';
        const deletePassOption = parsed.find((option) => option.name === '--delete_pass_test');
        deletePassEnabled.checked = !deletePassOption || deletePassOption.value !== '0';
        verbosityInput.value = 'UVM_MEDIUM';
        seedEnabled.checked = parsed.some((option) => option.name === '--seed');
        dumpEnabled.checked = true;
        dumpValue.textContent = '--dump_on=1';
        repeatInput.value = '1';
        parseError.textContent = '';
        renderOutput();
      } catch (error) {
        parseError.textContent = error.message;
      }
    }

    source.value = example;
    loadSource();
    source.addEventListener('input', loadSource);

    document.querySelector('#clear-button').addEventListener('click', () => {
      source.value = '';
      loadSource();
      source.focus();
    });

    verbosityInput.addEventListener('change', renderOutput);
    seedEnabled.addEventListener('change', renderOutput);
    seedValue.addEventListener('input', renderOutput);
    dumpEnabled.addEventListener('change', () => {
      dumpValue.textContent = `--dump_on=${dumpEnabled.checked ? '1' : '0'}`;
      renderOutput();
    });
    repeatInput.addEventListener('input', renderOutput);
    maxErrorInput.addEventListener('input', renderOutput);
    deletePassEnabled.addEventListener('change', renderOutput);
    farmEnabled.addEventListener('change', renderOutput);
    output.addEventListener('input', resizeOutput);
    window.addEventListener('resize', resizeOutput);

    document.querySelector('#copy-button').addEventListener('click', async (event) => {
      const label = event.currentTarget.querySelector('span');
      try {
        await navigator.clipboard.writeText(output.value);
        label.textContent = 'Copied';
      } catch {
        output.focus();
        output.select();
        label.textContent = 'Select & copy';
      }
      window.setTimeout(() => { label.textContent = 'Copy'; }, 1400);
    });
  </script>
</body>
</html>
